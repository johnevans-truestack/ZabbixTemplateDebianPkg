# Count all available updates
UserParameter=debian.updates.count,apt list --upgradable 2>/dev/null | tail -n +2 | wc -l

# Count security updates
UserParameter=debian.updates.security,/usr/bin/apt-get -s upgrade 2>/dev/null | grep -i security | wc -l

# Reboot required
UserParameter=debian.reboot.required,test -f /var/run/reboot-required && echo 1 || echo 0

# Last apt update age (hours)
UserParameter=debian.apt.age,echo $(( ($(date +%s) - $(stat -c %Y /var/lib/apt/periodic/update-success-stamp 2>/dev/null || echo 0))/3600 ))

# Installed packages
UserParameter=debian.packages.installed,dpkg-query -f '$${binary:Package}\n' -W | wc -l

# Unattended upgrades status
UserParameter=debian.unattended.status,systemctl is-active unattended-upgrades | grep -q active && echo 1 || echo 0

# Distribution version
UserParameter=debian.version,cat /etc/debian_version


# json package collection
UserParameter=debian.updates.json,apt list --upgradable 2>/dev/null | awk 'BEGIN{print "[";f=1} NR>1 {split($1,a,"/"); if(!f)printf ","; f=0; printf "{\"pkg\":\"%s\",\"available\":\"%s\"}",a[1],$2} END{print "]"}'

#last patched 
UserParameter=debian.lastupgrade.seconds,echo $(( $(date +%s) - $(stat -c %Y /var/log/apt/history.log) ))
